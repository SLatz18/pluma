name: Rewrite

options:
  bundleIdPrefix: com.scottlatz
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_MODULES: YES
    # Hardened runtime's library validation blocks dlopen between team-less
    # (self-signed) binaries, which breaks the test bundle and the debug
    # dylib. It's meaningless without a Developer ID cert anyway.
    ENABLE_HARDENED_RUNTIME: NO
    # A stable local signature keeps Accessibility/TCC grants valid across
    # rebuilds; ad-hoc signing changes the binary identity every build.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Local Self-Signed
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  Rewrite:
    type: application
    platform: macOS
    sources:
      - path: Rewrite
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - Rewrite.entitlements
      - path: Rewrite/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottlatz.Rewrite
        PRODUCT_NAME: Rewrite
        INFOPLIST_FILE: Rewrite/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Rewrite/Rewrite.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        PRODUCT_MODULE_NAME: Rewrite
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: Rewrite/Autocomplete/AccessibilityPrompt-Bridging-Header.h
      configs:
        # The launcher + debug-dylib split requires a team-signed certificate;
        # with a self-signed identity dyld rejects the pair at launch.
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    scheme:
      testTargets:
        - RewriteTests

  RewriteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RewriteTests
    dependencies:
      - target: Rewrite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottlatz.RewriteTests
        GENERATE_INFOPLIST_FILE: YES
