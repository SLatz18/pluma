name: Feature request
description: A focused idea to make Rewrite better
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Keep privacy implications explicit.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rewrite / recipes
        - Autocomplete
        - Dictation
        - Hotkeys
        - UI / design system
        - Providers / models
        - Docs / onboarding
        - Other
    validations:
      required: true
