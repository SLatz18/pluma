name: Full build and test (macOS)

# The complete macOS suite, kept dormant while development is a solo loop
# with the full suite running locally before every push. Costs nothing
# while manual-only: workflow_dispatch runs bill zero minutes until
# triggered.
#
# For production, re-enable hosted CI by replacing the trigger below with:
#
#   on:
#     pull_request:
#     push:
#       branches:
#         - main
#
# and either retire the slim Linux job in ci.yml or rename one of the two
# jobs — both are named "test", which the Protect main ruleset requires,
# and two checks reporting under one name is confusing.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same ref makes the in-flight run obsolete. Without this
# two quick pushes burn two full macOS runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          for app in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        # bootstrap.sh pins the expected version and fails loudly on a mismatch,
        # so a Homebrew bump surfaces here rather than as pbxproj diff noise.
        run: brew install xcodegen

      - name: Generate project and assets
        run: ./scripts/bootstrap.sh

      - name: Check the committed project matches project.yml
        # Pluma.xcodeproj is generated but tracked. bootstrap.sh just
        # regenerated it, so any diff means the committed project drifted from
        # project.yml and needs regenerating in the PR.
        run: |
          if ! git diff --exit-code -- Pluma.xcodeproj; then
            echo "::error::Pluma.xcodeproj is out of date. Run ./scripts/bootstrap.sh and commit the result."
            exit 1
          fi

      - name: Check design-system reuse
        run: ./scripts/check-design-system.sh

      - name: Validate property lists
        run: |
          plutil -lint Pluma/Info.plist
          plutil -lint Pluma/PrivacyInfo.xcprivacy
          plutil -lint Pluma/Pluma.entitlements

      - name: Confirm privacy manifest is packaged
        run: |
          test -f Pluma/PrivacyInfo.xcprivacy

      - name: Build and test
        run: |
          xcodebuild \
            -project Pluma.xcodeproj \
            -scheme Pluma \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build release configuration
        run: |
          xcodebuild \
            -project Pluma.xcodeproj \
            -scheme Pluma \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged resources
        run: |
          resources='DerivedData/Build/Products/Release/Pluma.app/Contents/Resources'
          test -f "$resources/PrivacyInfo.xcprivacy"
          # A broken asset catalog (missing app icon) otherwise ships silently.
          test -f "$resources/Assets.car"

      - name: Validate shipping metadata
        run: python3 scripts/validate-shipping.py
